name: Build and Publish UserScript

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/src/**'

jobs:
  build-scripts:
    name: Build JS and Auto-Commit
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'scripts/src/package-lock.json'

      - name: Install Dependencies & Build
        run: |
          cd scripts/src
          npm ci --no-fund --no-audit --loglevel=error
          npx rollup -c rollup.config.js

      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts/userScript.min.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-build userscript [skip ci]" && git push)
