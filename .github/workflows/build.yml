name: Build Fast-Tube (Cobalt TV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Cobalt APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Configure Android SDK and NDK paths
        run: |
          # ubuntu-latest comes with Android SDK and NDK pre-installed
          # The runner sets ANDROID_HOME. Cobalt will find the NDK there automatically.
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache ninja-build python3 python-is-python3 xz-utils curl git pkg-config gperf generate-ninja
          ls -l $ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/ || true
          
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Setup depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Fetch Cobalt Source (gclient)
        run: |
          mkdir cobalt-src && cd cobalt-src
          gclient config --name=src https://github.com/youtube/cobalt.git
          echo 'target_os = ["android"]' >> .gclient
          # Fetch with no-history to save time and space
          gclient sync --revision src@25.lts.1+ --no-history -j 4
          
          # Explicitly run the clang downloader because CI environments disable it by default
          bash src/starboard/tools/download_clang.sh
          
      - name: Apply VacuumTube Patches
        run: |
          cd cobalt-src/src
          echo "Applying Adblock and SponsorBlock patches..."
          for patch in ../../patches/*.patch; do
            if [ -f "$patch" ]; then
              patch -p1 < "$patch" || { echo "Failed to apply $patch"; exit 1; }
            fi
          done
          
          # Copy injected JS files
          cp -r ../../scripts/injection cobalt/browser/
          mkdir -p starboard/android/apk/app/src/app/assets
          mkdir -p starboard/android/apk/app/src/app/assets/web
          cp -r ../../scripts/injection/* starboard/android/apk/app/src/app/assets/
          cp -r ../../scripts/injection/* starboard/android/apk/app/src/app/assets/web/

      - name: Configure Build (Size Optimized)
        run: |
          cd cobalt-src/src
          
          # Create size-optimized args to ensure APK is < 15MB
          # - is_debug = false (Release build)
          # - is_official_build = true (Max optimizations)
          # - symbol_level = 0 (Strip symbols)
          # - optimize_for_size = true (Opt for size in compiler)
          PYTHONPATH=$PWD python3 cobalt/build/gn.py -p android-arm64 -c gold
          
          # Inject size-optimized args and explicitly disable remote execution by replacing defaults
          sed -i 's/use_remoteexec = true/use_remoteexec = false/g' out/android-arm64_gold/args.gn || true
          sed -i 's/use_goma = true/use_goma = false/g' out/android-arm64_gold/args.gn || true
          sed -i 's/use_siso = true/use_siso = false/g' out/android-arm64_gold/args.gn || true
          
          # Append our size optimizations and disable Werror
          cat <<EOF >> out/android-arm64_gold/args.gn
          is_debug = false
          is_official_build = true
          symbol_level = 0
          optimize_for_size = true
          strip_absolute_paths_from_debug_symbols = true
          use_siso = false
          treat_warnings_as_errors = false
          EOF
          
          # Regenerate ninja files with our injected arguments
          PYTHONPATH=$PWD gn gen out/android-arm64_gold

      - name: Build APK (Speed & Size Optimized)
        run: |
          cd cobalt-src/src
          export PYTHONPATH="$PWD"
          # We use autoninja without artificial limits to maximize speed
          autoninja -C out/android-arm64_gold cobalt.apk
          
          # Strip unneeded debug symbols from native libraries
          STRIP_TOOL="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          if [ -f "$STRIP_TOOL" ]; then
            echo "Stripping native libraries..."
            find out/android-arm64_gold -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} + || true
          fi

          echo "APK size summary:"
          ls -lh out/android-arm64_gold/*.apk out/android-arm64_gold/**/*.apk || true
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Tube-APK
          path: |
            cobalt-src/src/out/android-arm64_gold/*.apk
            cobalt-src/src/out/android-arm64_gold/**/*.apk
