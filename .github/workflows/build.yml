name: Build Fast-Tube (Cobalt TV)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 1
  CCACHE_MAXSIZE: 10G
  CCACHE_DIRECT: 1
  CCACHE_NOHASHDIR: 1
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,file_macro,locale_specific,modules
  NINJA_STATUS: "[%f/%t %e] "

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-arm64
            arch: arm64
            abi: arm64-v8a
            name: "Fast-Tube ARM64 (64-bit TV)"
          - platform: android-arm
            arch: arm
            abi: armeabi-v7a
            name: "Fast-Tube ARM32 (32-bit TV)"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Configure Android SDK and NDK paths
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Generate Android Debug Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo killall apt-get apt dpkg || true
          while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 1; done
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends ccache gperf ninja-build gcc-multilib g++-multilib libc6-dev-i386

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.platform }}-
            ${{ runner.os }}-ccache-

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

      - name: Cache Cobalt Source
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/cobalt-src
          key: cobalt-src-${{ hashFiles('patches/*.patch') }}
          restore-keys: |
            cobalt-src-

      - name: Fetch Cobalt Source (gclient)
        run: |
          mkdir -p cobalt-src && cd cobalt-src
          gclient config --name=src https://github.com/youtube/cobalt.git
          echo 'target_os = ["android"]' >> .gclient
          gclient sync --revision src@25.lts.1+ --no-history --shallow --reset --force -j 8
          bash src/starboard/tools/download_clang.sh

      - name: Apply Size & Performance Optimization Patches
        run: |
          cd cobalt-src/src
          cd ../../scripts/src
          npm install
          npx rollup -c rollup.config.js
          cd ../../cobalt-src/src
          npm install -g terser && terser ../../scripts/userScript.js -c -m --toplevel --ecma 2020 -o ../../scripts/userScript.min.js && cp ../../scripts/userScript.min.js cobalt/loader/embedded_resources/userScript.js
          echo "Applying APK Size and Performance Optimization patches..."
          for patch in ../../patches/*.patch; do
            if [ -f "$patch" ]; then
              echo "Applying $patch..."
              git apply --verbose "$patch" || patch --batch -p1 < "$patch" || { echo "Failed to apply $patch"; exit 1; }
            fi
          done

      - name: Configure Build (Size & Speed Optimized)
        run: |
          cd cobalt-src/src
          
          # Generate GN build config for target platform gold release
          PYTHONPATH=$PWD python3 cobalt/build/gn.py -p ${{ matrix.platform }} -c gold --no-check
          
          # Disable remote exec/goma/siso defaults
          sed -i 's/use_remoteexec = true/use_remoteexec = false/g' out/${{ matrix.platform }}_gold/args.gn || true
          sed -i 's/use_goma = true/use_goma = false/g' out/${{ matrix.platform }}_gold/args.gn || true
          sed -i 's/use_siso = true/use_siso = false/g' out/${{ matrix.platform }}_gold/args.gn || true
          
          # Append size and speed optimizations (Fast compile with -Os and no ThinLTO link bottleneck)
          cat <<EOF >> out/${{ matrix.platform }}_gold/args.gn
          cc_wrapper = "ccache"
          is_debug = false
          is_official_build = true
          symbol_level = 0
          cobalt_fastbuild = true
          optimize_for_size = true
          use_thin_lto = false
          strip_absolute_paths_from_debug_symbols = true
          use_siso = false
          treat_warnings_as_errors = false
          enable_in_app_dial = true
          v8_enable_webassembly = false
          sb_enable_benchmark = false
          enable_base_tracing = false
          cobalt_enable_webdriver = false
          enable_debugger = false
          enable_mdns = false
          enable_all_dialogs = false
          EOF
          
          # Regenerate ninja files
          PYTHONPATH=$PWD gn gen out/${{ matrix.platform }}_gold

      - name: Build APK (Compressed, Stripped & Minified)
        run: |
          cd cobalt-src/src
          export PYTHONPATH="$PWD"
          export GRADLE_OPTS="-Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs='-Xmx2048m -XX:+UseParallelGC'"
          
          echo "=== Ccache Status Before Build ==="
          ccache -s || true
          
          # Build target APK directly with balanced concurrency for fast ccache resolution and memory safety
          ninja -C out/${{ matrix.platform }}_gold cobalt.apk -j 4
          
          echo "=== Ccache Status After Build ==="
          ccache -s || true
          
          # Collect and standardize APK output name
          mkdir -p ${{ github.workspace }}/release-apks
          APK_FILE=$(find out/${{ matrix.platform }}_gold -name "*.apk" -type f | head -n 1)
          if [ -f "$APK_FILE" ]; then
            TARGET_APK="${{ github.workspace }}/release-apks/Fast-Tube-${{ matrix.abi }}-release.apk"
            cp "$APK_FILE" "$TARGET_APK"
            echo "Successfully created $TARGET_APK"
          else
            echo "Error: No APK found in out/${{ matrix.platform }}_gold"
            exit 1
          fi

      - name: Verify Size & Content (< 17MB Limit)
        run: |
          cd ${{ github.workspace }}/release-apks
          TARGET_APK="Fast-Tube-${{ matrix.abi }}-release.apk"
          
          echo "=== APK File Summary ==="
          ls -lh "$TARGET_APK"
          
          FILE_SIZE=$(stat -c%s "$TARGET_APK")
          MAX_SIZE=17825792 # 17 MB in bytes
          
          echo "Size in bytes: $FILE_SIZE / $MAX_SIZE max limit (17MB)"
          if [ "$FILE_SIZE" -gt "$MAX_SIZE" ]; then
            echo "::error::Output APK size exceeds 17MB limit ($FILE_SIZE bytes > $MAX_SIZE bytes)"
            exit 1
          fi
          echo "::notice::APK size is within limit: $(numfmt --to=iec-i --suffix=B $FILE_SIZE) (< 17MB)"
          
          echo "=== APK Zip Structure ==="
          unzip -l "$TARGET_APK" | head -n 25

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fast-Tube-${{ matrix.abi }}-APK
          path: release-apks/Fast-Tube-${{ matrix.abi }}-release.apk
